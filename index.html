<!DOCTYPE html>
<html>

<head>
  <title>Supply Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 40px;
    }

    .container {
      max-width: 320px;
      margin: auto;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }

    /* THE TRUE ALIGNMENT FIX */
    select,
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      margin-top: 4px;
      font-size: 13px;
      border: 1px solid #000;
      border-radius: 0;
      background-color: #fff;
      color: #000;
      height: 32px;               /* Force a matching, predictable layout block height */
      -webkit-appearance: none;   /* Strips default Safari/Chrome element scaling rules */
      -moz-appearance: none;      /* Strips Firefox scaling overrides */
      appearance: none;           /* Forces identical border line calculations */
    }

    /* Style dropdowns with a clean custom down arrow since appearance:none removes it */
    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px;
      padding-right: 24px;       /* Ensure text doesn't run into the custom arrow layout */
    }

    button {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      margin-top: 10px;
      font-size: 13px;
      border: 1px solid #000;
      border-radius: 0;
      background-color: #fff;
      color: #000;
      cursor: pointer;
    }

    #otherItem {
      display: none;
    }

    #successMessage {
      display: none;
      margin-top: 10px;
      padding: 6px;
      background-color: #e0e0e0;
      color: #000;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Report Supplies</h1>

    <form 
      id="form"
      action="https://google.com"
      method="POST"
      target="hidden_iframe"
      onsubmit="return handleSubmit()"
    >

      <!-- Item -->
      <label>Item</label>
      <select name="entry.1406252316" id="itemSelect" onchange="checkOther()">
        <option value="Soap">Soap</option>
        <option value="Toilet Paper">Toilet Paper</option>
        <option value="Paper Towel">Paper Towel</option>
        <option value="Pads">Pads</option>
        <option value="Tampons">Tampons</option>
        <option value="Other">Other</option>
      </select>

      <!-- Other input -->
      <input type="text" id="otherItem" placeholder="Type item here">

      <!-- Bathroom -->
      <label>Bathroom Type</label>
      <select name="entry.632713553">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Gender Neutral">Gender Neutral</option>
      </select>

      <!-- Location -->
      <label>Location</label>
      <input type="text" name="entry.1849314937" placeholder="e.g. Floor 1">

      <!-- Status -->
      <label>Status</label>
      <select name="entry.491903196">
        <option value="Out">Out</option>
        <option value="Low">Low</option>
      </select>

      <button type="submit">Submit</button>

    </form>

    <div id="successMessage">
      Request submitted successfully
    </div>

    <iframe name="hidden_iframe" style="display:none;"></iframe>

  </div>

  <script>
    function checkOther() {
      var select = document.getElementById("itemSelect");
      var otherBox = document.getElementById("otherItem");
      otherBox.style.display = (select.value === "Other") ? "block" : "none";
    }

    function handleSubmit() {
      var select = document.getElementById("itemSelect");
      var otherBox = document.getElementById("otherItem");

      if (select.value === "Other") {
        if (otherBox.value.trim() === "") {
          alert("Please type the item name.");
          return false;
        }
        select.value = otherBox.value;
      }

      document.getElementById("successMessage").style.display = "block";

      setTimeout(function() {
        document.getElementById("form").reset();
        document.getElementById("otherItem").style.display = "none";
      }, 800);

      return true;
    }
  </script>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Request</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #ffffff;
  margin: 40px;
}

.container {
  max-width: 320px;
  margin: auto;
}

@media (max-width: 480px) {
  body {
    margin: 20px 16px;
  }
  .container {
    max-width: 100%;
  }
}

h1 {
  font-size: 18px;
  margin-bottom: 15px;
}

label {
  display: block;
  margin-top: 10px;
  font-size: 13px;
}

select,
input,
button {
  width: 100%;
  padding: 10px 6px;
  margin-top: 4px;
  font-size: 16px;
  border: 1px solid #000;
  border-radius: 0;
  background-color: #fff;
  color: #000;
  box-sizing: border-box;
}

button {
  margin-top: 10px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: default;
}

#otherItem {
  display: none;
}

#successMessage {
  display: none;
  margin-top: 10px;
  padding: 6px;
  background-color: #e0e0e0;
  color: #000;
  font-size: 13px;
}

#errorMessage {
  display: none;
  margin-top: 10px;
  padding: 6px;
  background-color: #f4cccc;
  color: #000;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="container">
  <h1>Report Supplies</h1>

  <form id="form" onsubmit="return handleSubmit(event)">
    <!-- Item -->
    <label>Item</label>
    <select id="itemSelect" onchange="checkOther()">
      <option value="">Select item</option>
      <option value="Soap">Soap</option>
      <option value="Toilet Paper">Toilet Paper</option>
      <option value="Paper Towel">Paper Towel</option>
      <option value="Pads">Pads</option>
      <option value="Tampons">Tampons</option>
      <option value="Other">Other</option>
    </select>

    <!-- Other Item -->
    <input
      type="text"
      id="otherItem"
      placeholder="Type item here"
    >

    <!-- Bathroom -->
    <label>Bathroom Type</label>
    <select id="bathroom">
      <option value="">Select</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Gender neutral">Gender Neutral</option>
    </select>

    <!-- Location -->
    <label>Location</label>
    <input
      type="text"
      id="location"
      placeholder="e.g. Floor 1"
    >

    <!-- Status -->
    <label>Status</label>
    <select id="status">
      <option value="">Select</option>
      <option value="Out">Out</option>
      <option value="Low">Low</option>
    </select>

    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <div id="successMessage">
    Request submitted successfully
  </div>
  <div id="errorMessage"></div>
</div>

<script>
// This is the Web App URL from your Apps Script deployment.
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIrMBF_LDb_aweAW0AHtr93-luHR7xhh9lubbnQCt7MIR3jr-n5y1GP6lSHw6MSGkA/exec";

function checkOther() {
  const select = document.getElementById("itemSelect");
  const other = document.getElementById("otherItem");

  if (select.value === "Other") {
    other.style.display = "block";
  } else {
    other.style.display = "none";
    other.value = "";
  }
}

function showError(message) {
  const error = document.getElementById("errorMessage");
  error.textContent = message;
  error.style.display = "block";
  document.getElementById("successMessage").style.display = "none";
}

function handleSubmit(event) {
  event.preventDefault();

  const itemSelect = document.getElementById("itemSelect");
  const other = document.getElementById("otherItem");
  const bathroom = document.getElementById("bathroom");
  const location = document.getElementById("location");
  const status = document.getElementById("status");
  const error = document.getElementById("errorMessage");
  const success = document.getElementById("successMessage");
  const submitBtn = document.getElementById("submitBtn");

  // Hide old messages
  error.style.display = "none";
  success.style.display = "none";

  // Check item
  if (itemSelect.value === "") {
    showError("Please select an item.");
    return false;
  }

  // Check Other
  if (itemSelect.value === "Other" && other.value.trim() === "") {
    showError("Please type the item name.");
    return false;
  }

  // Check bathroom
  if (bathroom.value === "") {
    showError("Please select a bathroom type.");
    return false;
  }

  // Check location
  if (location.value.trim() === "") {
    showError("Please enter a location.");
    return false;
  }

  // Check status
  if (status.value === "") {
    showError("Please select a status.");
    return false;
  }

  const finalItem = itemSelect.value === "Other" ? other.value.trim() : itemSelect.value;

  const payload = {
    item: finalItem,
    bathroom: bathroom.value,
    location: location.value.trim(),
    status: status.value
  };

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  })
    .then(function (response) {
      return response.json();
    })
    .then(function (data) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";

      if (data.result === "success") {
        success.style.display = "block";
        document.getElementById("form").reset();
        other.style.display = "none";
      } else {
        showError("Something went wrong. Please try again.");
      }
    })
    .catch(function (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";
      showError("Error: " + err.message);
    });

  return false;
}
</script>

</body>
</html>

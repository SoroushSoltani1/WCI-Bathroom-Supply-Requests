<!DOCTYPE html>
<html>

<head>
  <title>Supply Request</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 40px;
    }

    .container {
      max-width: 320px;
      margin: auto;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
      font-size: 13px;
      border: 1px solid #000;
      border-radius: 0;
      background-color: #fff;
      color: #000;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      cursor: pointer;
    }

    #otherItem {
      display: none;
    }

    #successMessage {
      display: none;
      margin-top: 10px;
      padding: 6px;
      background-color: #e0e0e0;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Report Supplies</h1>

  <form 
    id="form"
    action="https://docs.google.com/forms/d/e/1FAIpQLSc9Ou3HIOlln2gQSxu2yRY2KmMrPynYYKKv4CU7WjEpqfUBzg/viewform"
    method="POST"
    target="hidden_iframe"
    onsubmit="return handleSubmit()"
  >

    <!-- Item -->
    <label>Item</label>
    <select name="entry.1406252316" id="itemSelect" onchange="checkOther()">
      <option value="">Select item</option>
      <option value="Soap">Soap</option>
      <option value="Toilet Paper">Toilet Paper</option>
      <option value="Paper Towel">Paper Towel</option>
      <option value="Pads">Pads</option>
      <option value="Tampons">Tampons</option>
      <option value="Other">Other</option>
    </select>

    <!-- Other -->
    <input type="text" id="otherItem" placeholder="Type item here">

    <!-- Bathroom -->
    <label>Bathroom Type</label>
    <select name="entry.632713553" id="bathroom">
      <option value="">Select</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Gender Neutral">Gender Neutral</option>
    </select>

    <!-- Location -->
    <label>Location</label>
    <input type="text" name="entry.1849314937" id="location" placeholder="e.g. Floor 1">

    <!-- Status -->
    <label>Status</label>
    <select name="entry.491903196" id="status">
      <option value="">Select</option>
      <option value="Out">Out</option>
      <option value="Low">Low</option>
    </select>

    <button type="submit">Submit</button>

  </form>

  <div id="successMessage">Request submitted successfully</div>

  <iframe name="hidden_iframe" style="display:none;"></iframe>

</div>

<script>
  function checkOther() {
    const select = document.getElementById("itemSelect");
    const other = document.getElementById("otherItem");

    if (select.value === "Other") {
      other.style.display = "block";
    } else {
      other.style.display = "none";
    }
  }

  function handleSubmit() {
    const item = document.getElementById("itemSelect");
    const other = document.getElementById("otherItem");
    const bathroom = document.getElementById("bathroom");
    const location = document.getElementById("location");
    const status = document.getElementById("status");

    // ITEM check
    if (!item.value) {
      alert("Please select an item.");
      return false;
    }

    // OTHER check
    if (item.value === "Other") {
      if (other.value.trim() === "") {
        alert("Please type the item name.");
        return false;
      }
      item.value = other.value;
    }

    // BATHROOM check
    if (!bathroom.value) {
      alert("Please select bathroom type.");
      return false;
    }

    // LOCATION check
    if (location.value.trim() === "") {
      alert("Please enter a location.");
      return false;
    }

    // STATUS check
    if (!status.value) {
      alert("Please select status.");
      return false;
    }

    // SUCCESS
    document.getElementById("successMessage").style.display = "block";

    setTimeout(() => {
      document.getElementById("form").reset();
      document.getElementById("otherItem").style.display = "none";
    }, 800);

    return true;
  }
</script>

</body>
</html>

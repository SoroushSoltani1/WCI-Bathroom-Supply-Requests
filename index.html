<!DOCTYPE html>
<html>

<head>
  <title>Supply Request</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 40px;
    }

    .container {
      max-width: 320px;
      margin: auto;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }

    select,
    input[type="text"],
    button {
      width: 100%;
      box-sizing: border-box;
      height: 32px;
      padding: 6px 10px;
      margin-top: 4px;
      font-size: 13px;
      border: 1px solid #000;
      border-radius: 0;
      background-color: #fff;
      color: #000;
      font-family: Arial, sans-serif;
    }

    button {
      margin-top: 12px;
      cursor: pointer;
    }

    #otherItem {
      display: none;
    }

    #successMessage {
      display: none;
      margin-top: 10px;
      padding: 6px;
      background-color: #e0e0e0;
      color: #000;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Report Supplies</h1>

    <form
      id="form"
      action="https://docs.google.com/forms/d/e/1FAIpQLSc9Ou3HIOlln2gQSxu2yRY2KmMrPynYYKKv4CU7WjEpqfUBzg/formResponse"
      method="POST"
      target="hidden_iframe"
      onsubmit="return handleSubmit()"
    >

      <label>Item</label>

      <select
        id="itemSelect"
        name="entry.1406252316"
        onchange="checkOther()"
      >
        <option value="Soap">Soap</option>
        <option value="Toilet Paper">Toilet Paper</option>
        <option value="Paper Towel">Paper Towel</option>
        <option value="Pads">Pads</option>
        <option value="Tampons">Tampons</option>
        <option value="Other">Other</option>
      </select>

      <input
        type="text"
        id="otherItem"
        placeholder="Type item here"
      >

      <label>Bathroom Type</label>

      <select name="entry.632713553">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Gender Neutral">Gender Neutral</option>
      </select>

      <label>Location</label>

      <input
        type="text"
        name="entry.1849314937"
        placeholder="e.g. Floor 1"
      >

      <label>Status</label>

      <select name="entry.491903196">
        <option value="Out">Out</option>
        <option value="Low">Low</option>
      </select>

      <button type="submit">Submit</button>

    </form>

    <div id="successMessage">
      Request submitted successfully
    </div>

    <iframe
      name="hidden_iframe"
      style="display:none;"
    ></iframe>

  </div>

  <script>
    function checkOther() {

      var select = document.getElementById("itemSelect");
      var otherBox = document.getElementById("otherItem");

      if (select.value === "Other") {

        otherBox.style.display = "block";

        select.name = "";
        otherBox.name = "entry.1406252316";

      } else {

        otherBox.style.display = "none";
        otherBox.value = "";

        select.name = "entry.1406252316";
        otherBox.name = "";
      }
    }

    function handleSubmit() {

      var select = document.getElementById("itemSelect");
      var otherBox = document.getElementById("otherItem");

      if (select.value === "Other") {

        if (otherBox.value.trim() === "") {
          alert("Please type the item name.");
          return false;
        }
      }

      document.getElementById("successMessage").style.display = "block";

      setTimeout(function () {

        document.getElementById("form").reset();

        document.getElementById("otherItem").style.display = "none";

        document.getElementById("successMessage").style.display = "none";

        document.getElementById("itemSelect").name = "entry.1406252316";
        document.getElementById("otherItem").name = "";

      }, 1200);

      return true;
    }
  </script>

</body>

</html>
